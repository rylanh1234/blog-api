<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1><a href="/">Blog API</a></h1>
    <div id="logoutDiv" hidden></div>
    <form id ="createPostForm" hidden>
        <div class="inputContainer">
            <div class="formGroup">
                <label for="postTitle">Title</label>
                <input type="text" id="postTitle" name="postTitle" required>
            </div>
            <div class="formGroup">
                <input type="text" id="postContent" name="postContent" required>
            </div>
        </div>
        <button type="submit" name="save">Save Draft</button>
        <button type="submit" name="post">Post Blog</button>
    </form>
    <script>
        async function loadCreatePost() {
            const createPostForm = document.getElementById("createPostForm");
            createPostForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(createPostForm));
                Object.assign(data, { btnName: e.submitter.name });
                const res = await fetch(`/api/posts`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const post = await res.json();
                window.location.href = "/";
            })
        }

        async function loadLogoutBtn() {
            const logoutBtn = document.createElement("button");
            logoutBtn.textContent = "Log Out";
            const logoutDiv = document.getElementById("logoutDiv");
            logoutDiv.appendChild(logoutBtn);
            logoutBtn.addEventListener("click", () => {
                localStorage.setItem("token", "undefined");
                window.location.href = "/";
            })
        }

        async function isVerified() {
            const token = localStorage.getItem("token"); // access token
            let user = null;
            if (token !== "undefined") {
                const res = await fetch("/api/protected", { // verify token
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                })
                if (res.status === 401) {
                    localStorage.setItem("token", "undefined"); // if token expired/is invalid, remove it and redirect login
                    window.location.href = "/";
                }
                const data = await res.json();
                user = data.user; // get user
            }
            if (user) {
                const logoutDiv = document.getElementById("logoutDiv");
                const createPostForm = document.getElementById("createPostForm");
                logoutDiv.hidden = false;
                createPostForm.hidden = false;
                loadCreatePost();
                loadLogoutBtn();   
            }
            else {
                window.location.href = "/";
            }
        }

        isVerified();
    </script>
</body>
</html>
