<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1><a href="/">Blog API</a></h1>
    <button id="deleteBtn">Delete</button>
    <form id ="createPostForm">
        <div class="inputContainer">
            <div class="formGroup">
                <label for="postTitle">Title</label>
                <input type="text" id="postTitle" name="postTitle" required>
            </div>
            <div class="formGroup">
                <input type="text" id="postContent" name="postContent" required>
            </div>
        </div>
        <button type="submit" name="save">Save Draft</button>
        <button type="submit" name="post">Post Blog</button>
    </form>
    <script>
        async function loadEditPost() {
            const slug = window.location.pathname.split("/")[1];
            const createPostForm = document.getElementById("createPostForm");
            const postTitle = document.getElementById("postTitle");
            const postContent = document.getElementById("postContent");
            const res = await fetch(`/api/posts/${slug}`);
            const savedPost = await res.json();
            postTitle.value = savedPost.title;
            postContent.value = savedPost.content;

            createPostForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(createPostForm));
                Object.assign(data, { btnName: e.submitter.name });
                const res = await fetch(`/api/posts/${slug}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const post = await res.json();
                window.location.href = "/";
            })
        }

        async function loadDeleteBtn() {
            const deleteBtn = document.getElementById("deleteBtn");
            deleteBtn.addEventListener(("click"), async (e) => {
                const slug = window.location.pathname.split("/")[1];
                const res = await fetch(`/api/posts/${slug}`, {
                    method: "DELETE",
                });
                const post = await res.json();
                window.location.href = "/";
            });
        }

        loadEditPost();
        loadDeleteBtn();
    </script>
</body>
</html>
