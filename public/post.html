<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1><a href="/">Blog API</a></h1>
    <h2 id="postTitle"></h2><h4 id="postAuthor"></h4>
    <p id="postContent"></p>
    <div id="postComments">
        <h2>Comments</h2>
        <form id ="postCommentsForm">
            <div class="inputContainer">
                <div class="formGroup">
                    <input type="text" id="commentText" name="commentText" placeholder="Add a comment">
                </div>
            </div>
            <button type="submit">Post comment</button>
        </form>
        <ul id="postCommentsList"></ul>
    </div>

     <script>
        async function loadPost() {
            const slug = window.location.pathname.split("/")[1];
            const res = await fetch(`/api/posts/${slug}`);
            const post = await res.json();

            const postTitle = document.getElementById("postTitle");
            postTitle.textContent = post.title;

            const postAuthor = document.getElementById("postAuthor");
            postAuthor.textContent = "by " + post.author.name;

            const postContent = document.getElementById("postContent");
            postContent.textContent = post.content;

            post.comments.map((comment) => {
                const postCommentsLi = document.createElement("li");
                const postCommentsList = document.getElementById("postCommentsList");
                postCommentsLi.textContent = comment.author.name + " · MM/DD/YYYY : " + comment.content;
                postCommentsList.appendChild(postCommentsLi);
            })

            const postCommentsForm = document.getElementById("postCommentsForm");
            postCommentsForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(postCommentsForm)); // get input from form and convert the pair into JS object
                const res = await fetch(`/api/posts/${slug}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }, // specify JSON
                    body: JSON.stringify(data) // JS object into JS string
                });
                const comment = await res.json();
                window.location.reload(); // refresh page after posting comment
            })
        }

        loadPost();
    </script>
</body>
</html>
