<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1><a href="/">Blog API</a></h1>
    <div id="logoutDiv" hidden></div>
    <h2 id="postTitle"></h2><h4 id="postAuthor"></h4>
    <p id="postContent"></p>
    <button id="unpublishBtn" hidden>Unpublish</button>
    <button id="deleteBtn" hidden>Delete</button>
    <div id="postComments">
        <h2>Comments</h2>
        <h3 id="loginToComment">Log in to comment</h3>
        <form id ="postCommentsForm" hidden>
            <div class="inputContainer">
                <div class="formGroup">
                    <input type="text" id="commentText" name="commentText" placeholder="Add a comment" required>
                </div>
            </div>
            <button type="submit">Post comment</button>
        </form>
        <ul id="postCommentsList"></ul>
    </div>

     <script>
        async function loadPost() {
            const slug = window.location.pathname.split("/")[1];
            const res = await fetch(`/api/posts/${slug}`);
            const post = await res.json();

            const postTitle = document.getElementById("postTitle");
            postTitle.textContent = post.title;

            const postAuthor = document.getElementById("postAuthor");
            postAuthor.textContent = "by " + post.author.name;

            const postContent = document.getElementById("postContent");
            postContent.textContent = post.content;

            post.comments.map((comment) => {
                const postCommentsLi = document.createElement("li");
                const postCommentsList = document.getElementById("postCommentsList");
                postCommentsLi.textContent = comment.author.name + " · " + dateFormat(comment.createdAt) + " : " + comment.content;
                postCommentsList.appendChild(postCommentsLi);
            })
        }

        async function loadUnpublishBtn(user) {
            const unpublishBtn = document.getElementById("unpublishBtn");
            const slug = window.location.pathname.split("/")[1];
            const res = await fetch(`/api/posts/${slug}`);
            const post = await res.json();
            if (post.authorId === user.id) {
                unpublishBtn.hidden = false;
                unpublishBtn.addEventListener(("click"), async (e) => {
                    const res = await fetch(`/api/posts/${slug}/unpublish`, {
                        method: "PATCH",
                    });
                    const unpublishedPost = await res.json();
                    window.location.href = "/";
                });
            }
        }

        async function loadDeleteBtn(user) {
            const deleteBtn = document.getElementById("deleteBtn");
            const slug = window.location.pathname.split("/")[1];
            const res = await fetch(`/api/posts/${slug}`);
            const post = await res.json();
            if (post.authorId === user.id) {
                deleteBtn.hidden = false;
                deleteBtn.addEventListener(("click"), async (e) => {
                    const res = await fetch(`/api/posts/${slug}`, {
                        method: "DELETE",
                    });
                    const deletedPost = await res.json();
                    window.location.href = "/";
                });
            }
        }

        async function loadLogoutBtn() {
            const logoutBtn = document.createElement("button");
            logoutBtn.textContent = "Log Out";
            const logoutDiv = document.getElementById("logoutDiv");
            logoutDiv.appendChild(logoutBtn);
            logoutBtn.addEventListener("click", () => {
                localStorage.setItem("token", "undefined");
                window.location.href = "/";
            })
        }

        async function loadPostCommentsForm(user) {
            const postCommentsForm = document.getElementById("postCommentsForm");
            postCommentsForm.hidden = false;
            const slug = window.location.pathname.split("/")[1];
            postCommentsForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(postCommentsForm)); // get input from form and convert the pair into JS object
                Object.assign(data, { authorId: user.id });
                const res = await fetch(`/api/posts/${slug}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }, // specify JSON
                    body: JSON.stringify(data) // JS object into JS string
                });
                const comment = await res.json();
                window.location.reload(); // refresh page after posting comment
            })
        }

        async function isVerified() {
            const token = localStorage.getItem("token"); // access token
            let user = null;
            if (token !== "undefined") {
                const res = await fetch("/api/protected", { // verify token
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                })
                if (res.status === 401) {
                    localStorage.setItem("token", "undefined"); // if token expired/is invalid, remove it and redirect login
                    window.location.href = "/";
                }
                const data = await res.json();
                user = data.user; // get user
            }
            if (user) {
                const logoutDiv = document.getElementById("logoutDiv");
                const loginToComment = document.getElementById("loginToComment");
                logoutDiv.hidden = false;
                loginToComment.hidden = true; 
                
                loadUnpublishBtn(user);
                loadDeleteBtn(user);
                loadLogoutBtn();
                loadPostCommentsForm(user);
            }
        }

        // wrap date from db in new Date() to handle null, strings, or Dates
        // and then changes format to M D, Y at XX:XX X.m.
        function dateFormat(date) { 
            const formattedDate = new Date(date).toLocaleString(`en-CA`, {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            })
            return formattedDate;
        }

        isVerified();
        loadPost();
    </script>
</body>
</html>
