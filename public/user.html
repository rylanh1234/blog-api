<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1>Blog API</h1>
    <div id="userName"></div>
    <a href="/create" id="create" hidden>Create</a>
    <div id="logoutDiv"></div>
    <div id="blogPosts">
        <div id="unpublishedPosts">
            <h3 id="unpublishedHeader"></h3>
            <ul id="postsListUnPub"></ul>
        </div>
        <div id="publishedPosts">
            <ul id="postsListPub"></ul>
        </div>
    </div>
    <div id="loginDiv"></div>
    <div id="signupDiv"></div>

    <script>
        async function loadUser() {
            const res = await fetch("/api/user");
            const user = await res.json();
            const userName = document.getElementById("userName");
            userName.textContent = "Welcome Back " + user[0].name;
            const create = document.getElementById("create");
            create.hidden = false;

            // logout
            const logoutBtn = document.createElement("button");
            logoutBtn.textContent = "Log Out";
            const logoutDiv = document.getElementById("logoutDiv");
            logoutDiv.appendChild(logoutBtn);
            logoutBtn.addEventListener("click", () => {
                localStorage.setItem("token", "undefined");
                window.location.href = "/";
            })
        }
        async function loadPosts() {
            const res = await fetch("/api/posts");
            const posts = await res.json();
            posts.map((post) => {
                if (post.published) {
                    const postsLi = document.createElement("li");                    
                    const postsA = document.createElement("a");
                    const postsList = document.getElementById("postsListPub");
                    postsA.textContent = post.title;
                    postsA.href = "/" + post.title.toLowerCase().replace(" ", "-");
                    postsLi.appendChild(postsA)
                    postsList.appendChild(postsLi);
                }
            })
        }

        async function loadDrafts() {
            const res = await fetch("/api/posts");
            const posts = await res.json();
            posts.map((post) => {
                if (!post.published) {
                    const unpublishedHeader = document.getElementById("unpublishedHeader");
                    if (unpublishedHeader.textContent === "") {
                        unpublishedHeader.textContent = "Drafts";
                    }
                    const postsLi = document.createElement("li");                    
                    const postsA = document.createElement("a");
                    const postsList = document.getElementById("postsListUnPub");
                    postsA.textContent = post.title;
                    postsA.href = "/" + post.title.toLowerCase().replace(" ", "-") + "/edit";
                    postsLi.appendChild(postsA);
                    postsList.appendChild(postsLi);
                }})
                }

        async function loadLogin() {
            const loginHeader = document.createElement("h3");
            loginHeader.textContent = "Please log in";

            const loginForm = document.createElement("form");

            const usernameLabel = document.createElement("label");
            usernameLabel.htmlFor = "username";
            usernameLabel.textContent = "Email";

            const usernameInput = document.createElement("input");
            usernameInput.id = "username";
            usernameInput.name = "username";
            usernameInput.placeholder = "email";
            usernameInput.type = "text";

            const passwordLabel = document.createElement("label");
            passwordLabel.htmlFor = "password";
            passwordLabel.textContent = "Password";
            
            const passwordInput = document.createElement("input");
            passwordInput.id = "password";
            passwordInput.name = "password";
            passwordInput.type = "password";

            const submitBtn = document.createElement("button");
            submitBtn.type = "submit";
            submitBtn.textContent = "Log In";

            loginForm.appendChild(loginHeader);
            loginForm.appendChild(usernameLabel);
            loginForm.appendChild(usernameInput);
            loginForm.appendChild(passwordLabel);
            loginForm.appendChild(passwordInput);
            loginForm.appendChild(submitBtn);
            const loginDiv = document.getElementById("loginDiv");
            loginDiv.appendChild(loginForm);

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(loginForm));
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
                const { token } = await res.json(); // get token
                localStorage.setItem("token", token); // store token
                window.location.reload();
            })

            // sign up
            const signupDiv = document.getElementById("signupDiv");
            const signupA = document.createElement("a");
            signupA.textContent = "Sign Up";
            signupA.href = "/sign-up";
            signupDiv.appendChild(signupA);
        }
        
        async function isVerified() {
            const token = localStorage.getItem("token"); // access token
            let user = null;
            if (token !== "undefined") {
                const res = await fetch("/api/protected", { // verify token
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                })
                if (res.status === 401) {
                    localStorage.setItem("token", "undefined"); // if token expired/is invalid, remove it and redirect login
                    window.location.href = "/";
                }
                const data = await res.json();
                user = data.user; // get user
            }
            if (user) {
                loadUser();
                loadDrafts();
            }
            else {
                loadLogin();
            }
        }

        isVerified();
        loadPosts();
    </script>
</body>
</html>
