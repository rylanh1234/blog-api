<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API</title>
</head>
<body>
    <h1>Blog API</h1>
    <div id="userName"></div>
    <a href="/create">Create</a>
    <div id="blogPosts">
        <div id="unpublishedPosts">
            <h3 id="unpublishedHeader"></h3>
            <ul id="postsListUnPub"></ul>
        </div>
        <div id="publishedPosts">
            <ul id="postsListPub"></ul>
        </div>
    </div>

    <script>
        async function loadUser() {
            const res = await fetch("/api/user");
            const user = await res.json();
            const userName = document.getElementById("userName");
            userName.textContent = "Welcome Back " + user[0].name;
        }
        async function loadPosts() {
            const res = await fetch("/api/posts");
            const posts = await res.json();
            posts.map((post) => {
                if (post.published) {
                    const postsLi = document.createElement("li");                    
                    const postsA = document.createElement("a");
                    const postsList = document.getElementById("postsListPub");
                    postsA.textContent = post.title;
                    postsA.href = "/" + post.title.toLowerCase().replace(" ", "-");
                    postsLi.appendChild(postsA)
                    postsList.appendChild(postsLi);
                }
                else {
                    const unpublishedHeader = document.getElementById("unpublishedHeader");
                    if (unpublishedHeader.textContent === "") {
                        unpublishedHeader.textContent = "Drafts";
                    }
                    const postsLi = document.createElement("li");                    
                    const postsA = document.createElement("a");
                    const postsList = document.getElementById("postsListUnPub");
                    postsA.textContent = post.title;
                    postsA.href = "/" + post.title.toLowerCase().replace(" ", "-") + "/edit";
                    postsLi.appendChild(postsA)
                    postsList.appendChild(postsLi);
                }
            })
        }
        loadUser();
        loadPosts();
    </script>
</body>
</html>
